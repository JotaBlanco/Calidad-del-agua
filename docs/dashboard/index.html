<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calidad del Agua en España — Dashboard SINAC</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="css/style.css?v=4" />
</head>
<body>
    <header>
        <div class="header-left">
            <h1>Calidad del Agua en España</h1>
            <p class="subtitle">Datos SINAC — <span id="last-update">—</span></p>
        </div>
        <div id="summary-stats">
            <span class="stat-badge ok"><span id="stat-ok">—</span> Apto</span>
            <span class="stat-badge warning"><span id="stat-warning">—</span> No apto</span>
            <span class="stat-badge danger"><span id="stat-danger">—</span> No potable</span>
            <span class="stat-total"><span id="stat-total">—</span> puntos</span>
        </div>
    </header>

    <main>
        <aside id="sidebar">
            <div id="filters">
                <div class="filter-group">
                    <label for="select-provincia">Provincia</label>
                    <select id="select-provincia" disabled>
                        <option value="">Cargando...</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="select-municipio">Municipio</label>
                    <select id="select-municipio" disabled>
                        <option value="">— Selecciona provincia —</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="select-punto">Punto de muestreo</label>
                    <select id="select-punto" disabled>
                        <option value="">— Todos —</option>
                    </select>
                </div>
            </div>

            <div id="selection-tags"></div>

            <div id="punto-list">
                <div class="punto-list-placeholder">
                    <p>Selecciona un municipio o haz clic en el mapa.</p>
                </div>
            </div>
        </aside>

        <section id="map-container">
            <div id="map"></div>
        </section>

        <section id="detail-panel">
            <div id="detail-content">
                <div class="detail-placeholder">
                    <p>Selecciona una provincia y haz clic en un punto del mapa para ver sus mediciones.</p>
                </div>
            </div>
        </section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="js/map.js?v=4"></script>
    <script src="js/chart.js?v=4"></script>
    <script src="js/filters.js?v=4"></script>
    <script src="js/puntolist.js?v=4"></script>
    <script src="js/detail.js?v=4"></script>
    <script src="js/app.js?v=4"></script>
</body>
</html>
