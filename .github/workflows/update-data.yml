name: Update Water Quality Data

# Two provinces per night, scraped concurrently — never more.  SINAC has
# fallen over under heavier parallelism before, so the concurrency is capped
# in three independent places: MAX_PARALLEL below, the `concurrency` group
# (which queues overlapping runs instead of running them side by side), and
# the per-request sleeps already built into the scraper.
#
# Hard constraint: GitHub-hosted runners kill any job at 6h, regardless of
# `timeout-minutes`.  The previous version asked for 7h and every single run
# was cancelled at 6h05m before reaching the data pipeline.  The three limits
# below are staggered: 4h scrape < 5h30 job < 6h runner.

on:
  schedule:
    - cron: '0 2 * * *'   # daily at 02:00 UTC (03:00 CET / 04:00 CEST)
  workflow_dispatch:
    inputs:
      provincia:
        description: 'Province code(s) to scrape, space or comma separated (empty = auto)'
        type: string
        required: false
      skip_scrape:
        description: 'Skip scraping entirely'
        type: boolean
        default: false
      rebuild:
        description: 'Run merge + ETL + dashboard build (see note in the scrape step)'
        type: boolean
        default: false

permissions:
  contents: write

# Never let two runs scrape at the same time — a manual dispatch during the
# nightly run would otherwise put four scrapers on SINAC at once.
concurrency:
  group: scrape-sinac
  cancel-in-progress: false

env:
  # 4h for scraping, leaving ~1.5h of headroom under the 6h runner cap.
  SCRAPE_TIMEOUT_SECONDS: 14400
  # Hard ceiling on concurrent scrapers. Do not raise without testing:
  # SINAC has gone down under heavier load.
  MAX_PARALLEL: 2

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # 5h30 — must stay below the 6h hard cap

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Restore cached scraper data from previous runs ──
      - name: Restore scraper cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/csvs/
            data/progress/
          key: scraper-data-${{ github.run_id }}
          restore-keys: |
            scraper-data-

      # ── Pick tonight's provinces and decide resume-vs-refresh ──
      #
      # This is a work queue, not a calendar rotation.  A median province has
      # 153 municipalities and does not fit in one 4h window, so provinces
      # already under way are picked first — otherwise a half-scraped province
      # would wait a full cycle for its next turn.  Only once everything is
      # complete do we take the next calendar slots and reset them, starting a
      # fresh refresh pass.
      #
      # The reset matters: scrape_province() skips anything already in
      # `completed`, so re-running a finished province without --reset is a
      # no-op and the data would never refresh.
      #
      # Emits `plan` as "CODE:RESET CODE:RESET", e.g. "36:false 15:true".
      - name: Determine provinces
        id: prov
        run: |
          mkdir -p data/progress
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib, datetime, csv, collections, re

          with open("data/locations_catalog.csv", newline="", encoding="utf-8") as f:
              catalog = list(csv.DictReader(f))

          total_by_prov = collections.Counter(int(r["provincia_code"]) for r in catalog)
          name_by_prov = {int(r["provincia_code"]): r["provincia_name"] for r in catalog}

          def completed(p):
              pf = pathlib.Path(f"data/progress/progress_{p}.json")
              if not pf.exists():
                  return 0
              try:
                  return len(json.loads(pf.read_text())["completed"])
              except (ValueError, KeyError):
                  return 0

          n_slots = int(os.environ["MAX_PARALLEL"])
          override = os.environ.get("INPUT_PROVINCIA", "").strip()

          if override:
              selected = [int(x) for x in re.split(r"[,\s]+", override) if x][:n_slots]
          else:
              # Finish what is already under way first, closest-to-done first.
              selected = sorted(
                  (p for p, total in total_by_prov.items() if completed(p) < total),
                  key=completed,
                  reverse=True,
              )[:n_slots]

              # Top up from the calendar rotation with fully-scraped provinces.
              if len(selected) < n_slots:
                  doy = datetime.datetime.now(datetime.timezone.utc).timetuple().tm_yday
                  for i in range(52):
                      if len(selected) >= n_slots:
                          break
                      p = ((doy * n_slots + i) % 52) + 1
                      if p not in selected and p in total_by_prov:
                          selected.append(p)

          plan, described = [], []
          for p in selected:
              total, done = total_by_prov.get(p, 0), completed(p)
              reset = total and done >= total
              plan.append(f"{p}:{'true' if reset else 'false'}")
              described.append(
                  f"{p} {name_by_prov.get(p, p)} ({done}/{total}"
                  f"{', fresh pass' if reset else ', resuming'})"
              )

          print("plan=" + " ".join(plan))
          print("described=" + " | ".join(described))
          PY
        env:
          INPUT_PROVINCIA: ${{ inputs.provincia }}

      # Exactly MAX_PARALLEL scrapers, launched as background jobs and waited
      # on.  Each gets its own `timeout`, so one province stalling does not
      # eat the other's budget.  Output is prefixed per province because the
      # two logs interleave.
      - name: Scrape SINAC
        if: ${{ !inputs.skip_scrape }}
        # `shell: bash` gives -eo pipefail.  pipefail is load-bearing: without
        # it the pipeline's status is sed's, so a scraper cut off at 4h would
        # look like a clean finish in the log.
        shell: bash
        run: |
          mkdir -p data/raw/csvs data/progress data/logs
          echo "Plan: ${{ steps.prov.outputs.described }}"
          echo ""

          PIDS=()
          for ENTRY in ${{ steps.prov.outputs.plan }}; do
            PROV="${ENTRY%%:*}"
            RESET=""
            [ "${ENTRY##*:}" = "true" ] && RESET="--reset"

            (
              timeout --signal=INT "$SCRAPE_TIMEOUT_SECONDS" \
                python -u scraper/scrape_all.py \
                  --provincia "$PROV" --skip-pdfs --use-html $RESET \
                2>&1 | sed -u "s/^/[$PROV] /"
            ) &
            PIDS+=($!)
          done

          for PID in "${PIDS[@]}"; do
            wait "$PID" \
              || echo "A scraper stopped (timeout or error) — progress is saved, next run resumes."
          done

      # Must run even when the scrape is interrupted, or the work is lost.
      - name: Save scraper cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            data/raw/csvs/
            data/progress/
          key: scraper-data-${{ github.run_id }}

      - name: Report
        if: always()
        run: |
          {
            echo "### Scrape plan"
            echo ""
            echo "${{ steps.prov.outputs.described }}" | tr '|' '\n' | sed 's/^/- /'
            echo ""
            echo "### After this run"
            echo ""
            echo "| Province | Completed | Total |"
            echo "|---|---:|---:|"
          } >> "$GITHUB_STEP_SUMMARY"

          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib, csv, collections
          with open("data/locations_catalog.csv", newline="", encoding="utf-8") as f:
              catalog = list(csv.DictReader(f))
          total = collections.Counter(int(r["provincia_code"]) for r in catalog)
          names = {int(r["provincia_code"]): r["provincia_name"] for r in catalog}
          grand = 0
          for p in sorted(total):
              pf = pathlib.Path(f"data/progress/progress_{p}.json")
              done = len(json.loads(pf.read_text())["completed"]) if pf.exists() else 0
              grand += done
              if done < total[p]:
                  print(f"| {names[p]} | {done} | {total[p]} |")
          print(f"| **All Spain** | **{grand}** | **{sum(total.values())}** |")
          PY

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "CSVs in cache: $(ls data/raw/csvs/*.csv 2>/dev/null | wc -l)" >> "$GITHUB_STEP_SUMMARY"

      # ── Data pipeline ──
      #
      # Opt-in only.  These steps load the full ~2.4 GB all_data.csv into a
      # pandas DataFrame and write a ~4 GB enriched copy; with 2.5 GB of cached
      # CSVs on top, that does not fit a standard runner (16 GB RAM / 14 GB SSD).
      # Until the ETL is chunked, run these locally:
      #     python scripts/merge_csvs.py
      #     python -m scripts.run_etl
      #     python -m scripts.build_dashboard_data
      - name: Merge raw CSVs
        if: ${{ inputs.rebuild }}
        run: python scripts/merge_csvs.py

      - name: Run ETL pipeline
        if: ${{ inputs.rebuild }}
        run: python -m scripts.run_etl

      - name: Build dashboard JSON files
        if: ${{ inputs.rebuild }}
        run: python -m scripts.build_dashboard_data

      - name: Upload to Kaggle
        if: ${{ inputs.rebuild }}
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ -z "$KAGGLE_USERNAME" ]; then
            echo "Kaggle secrets not configured, skipping upload"
            exit 0
          fi
          pip install kaggle
          mkdir -p data/kaggle/files
          gzip -c data/processed/all_data_enriched.csv > data/kaggle/files/all_data_enriched.csv.gz
          cp data/kaggle/dataset-metadata.json data/kaggle/files/dataset-metadata.json
          kaggle datasets version -p data/kaggle/files/ -m "Update $(date +%Y-%m-%d)" \
            || kaggle datasets create -p data/kaggle/files/

      - name: Commit and push dashboard data
        if: ${{ inputs.rebuild }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/dashboard/data/
          if git diff --staged --quiet; then
            echo "No changes to dashboard data"
          else
            git commit -m "chore: update dashboard data $(date +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
