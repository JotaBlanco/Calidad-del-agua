name: Update Water Quality Data

# Nightly refresh, in two jobs:
#
#   scrape  — up to MAX_PARALLEL provinces for SCRAPE_TIMEOUT_SECONDS, saving
#             the raw CSVs and the per-province progress to the Actions cache.
#   publish — rebuilds the dashboard JSON for exactly those provinces, commits
#             it (which is what updates GitHub Pages) and backs the raw data up
#             to a release.
#
# Two jobs and not one because GitHub-hosted runners kill any *job* at 6h no
# matter what `timeout-minutes` says.  Every run before 2026-08-06 died that
# way.  Splitting means the 5h scrape and the publishing each get their own 6h
# budget, and a scrape that overruns can no longer take the publishing down
# with it.
#
# The source of truth for measurements is `data/raw/csvs/` — the scraper's own
# output.  It is gitignored, so it lives in the Actions cache (evicted after 7
# days without a hit) and, since this workflow was rewritten, in the `raw-data`
# release, which is what makes it survivable.

on:
  schedule:
    - cron: '0 2 * * *'   # daily at 02:00 UTC (03:00 CET / 04:00 CEST)
  workflow_dispatch:
    inputs:
      provincia:
        description: 'Province code(s) to scrape, space or comma separated (empty = auto)'
        type: string
        required: false
      skip_scrape:
        description: 'Skip scraping, just rebuild and publish'
        type: boolean
        default: false
      rebuild_all:
        description: 'Rebuild the dashboard for every province (~20 min) instead of just tonight’s'
        type: boolean
        default: false

permissions:
  contents: write

# Never let two runs scrape at the same time — a manual dispatch during the
# nightly run would otherwise put six scrapers on SINAC at once.
concurrency:
  group: scrape-sinac
  cancel-in-progress: false

env:
  # 5h of scraping, leaving ~1h of headroom under the 6h runner cap.
  SCRAPE_TIMEOUT_SECONDS: 18000
  # Concurrent scrapers.  Two ran for nine nights with zero failed
  # municipalities; three is a deliberate step up and has NOT been proven
  # against SINAC, which has gone down under heavy load before.  If the nightly
  # report starts showing FAILED municipalities, put this back to 2.
  MAX_PARALLEL: 3

jobs:
  # ── 1. Scrape ───────────────────────────────────────────────────────
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # 5h30 — 5h of scraping plus cache handling

    outputs:
      codes: ${{ steps.prov.outputs.codes }}
      described: ${{ steps.prov.outputs.described }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore scraper cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/csvs/
            data/progress/
          key: scraper-data-${{ github.run_id }}
          restore-keys: |
            scraper-data-

      # Order and resume rules live in the script, not here — see its docstring.
      - name: Determine provinces
        id: prov
        run: |
          mkdir -p data/progress
          python -m scripts.select_provinces --slots "$MAX_PARALLEL" | tee -a "$GITHUB_OUTPUT"
        env:
          INPUT_PROVINCIA: ${{ inputs.provincia }}

      # One scraper per province, each with its own `timeout` so a province
      # that stalls does not eat the others' budget.  Output is prefixed per
      # province because the logs interleave.
      - name: Scrape SINAC
        if: ${{ !inputs.skip_scrape }}
        # `shell: bash` gives -eo pipefail.  pipefail is load-bearing: without
        # it the pipeline's status is sed's, so a scraper cut off at the
        # timeout would look like a clean finish in the log.
        shell: bash
        run: |
          mkdir -p data/raw/csvs data/progress data/logs
          echo "Plan: ${{ steps.prov.outputs.described }}"
          echo ""

          PIDS=()
          for ENTRY in ${{ steps.prov.outputs.plan }}; do
            PROV="${ENTRY%%:*}"
            RESET=""
            [ "${ENTRY##*:}" = "true" ] && RESET="--reset"

            (
              timeout --signal=INT "$SCRAPE_TIMEOUT_SECONDS" \
                python -u scraper/scrape_all.py \
                  --provincia "$PROV" --skip-pdfs --use-html $RESET \
                2>&1 | sed -u "s/^/[$PROV] /"
            ) &
            PIDS+=($!)
          done

          for PID in "${PIDS[@]}"; do
            wait "$PID" \
              || echo "A scraper stopped (timeout or error) — progress is saved, next run resumes."
          done

      # Must run even when the scrape is interrupted, or the night is lost.
      - name: Save scraper cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            data/raw/csvs/
            data/progress/
          key: scraper-data-${{ github.run_id }}

      - name: Report
        if: always()
        run: |
          {
            echo "### Scrape plan"
            echo ""
            echo "${{ steps.prov.outputs.described }}" | tr '|' '\n' | sed 's/^/- /'
            echo ""
            echo "### After this run"
            echo ""
            echo "| Province | Completed | Total |"
            echo "|---|---:|---:|"
          } >> "$GITHUB_STEP_SUMMARY"

          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib, csv, collections
          with open("data/locations_catalog.csv", newline="", encoding="utf-8") as f:
              catalog = list(csv.DictReader(f))
          total = collections.Counter(int(r["provincia_code"]) for r in catalog)
          names = {int(r["provincia_code"]): r["provincia_name"] for r in catalog}
          grand = 0
          for p in sorted(total):
              pf = pathlib.Path(f"data/progress/progress_{p}.json")
              done = len(json.loads(pf.read_text())["completed"]) if pf.exists() else 0
              grand += done
              if done < total[p]:
                  print(f"| {names[p]} | {done} | {total[p]} |")
          print(f"| **All Spain** | **{grand}** | **{sum(total.values())}** |")
          PY

          # The CSV count reported here has read 13062 every night since the
          # cache was seeded, while the seed tarball holds exactly 6531 files
          # and the scraper only ever appends to existing ones.  These three
          # lines are here to identify the extra entries; drop them once the
          # count is explained.
          {
            echo ""
            echo "CSVs (shell glob): $(ls data/raw/csvs/*.csv 2>/dev/null | wc -l)"
            echo "CSVs (find):       $(find data/raw/csvs -maxdepth 1 -name '*.csv' | wc -l)"
            echo "Empty CSVs:        $(find data/raw/csvs -maxdepth 1 -name '*.csv' -size -1c | wc -l)"
            echo "Non-CSV entries:   $(find data/raw/csvs -maxdepth 1 ! -name '*.csv' | wc -l)"
            echo ""
            echo "First 5 by name:"
            ls data/raw/csvs | head -5 | sed 's/^/  /'
            echo "Last 5 by name:"
            ls data/raw/csvs | tail -5 | sed 's/^/  /'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 2. Publish ──────────────────────────────────────────────────────
  #
  # Runs even when the scrape job failed or was cancelled: the cache is saved
  # with `if: always()`, so there is normally still a night's work to publish.
  # With no cache at all the province builds find no CSVs, leave the existing
  # JSON untouched and nothing gets committed.
  publish:
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120   # ~2 min for a night's provinces, ~20 for --all

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore scraper cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/csvs/
            data/progress/
          key: scraper-data-${{ github.run_id }}
          restore-keys: |
            scraper-data-

      # Records the date of every pass that finished tonight, which is what
      # keeps the rotation moving to the next province.  Skipped when nothing
      # was scraped, or a province would be marked as refreshed for a night it
      # never ran and lose its turn.
      - name: Record completed passes
        if: ${{ needs.scrape.outputs.codes != '' && !inputs.skip_scrape }}
        run: python -m scripts.select_provinces --stamp $CODES
        env:
          CODES: ${{ needs.scrape.outputs.codes }}

      # This is the step that was missing: without it the scraper filled a
      # cache nobody read and the dashboard stayed on whatever was last built
      # by hand (19 February).
      - name: Rebuild dashboard JSON
        run: |
          if [ "${{ inputs.rebuild_all }}" = "true" ]; then
            python -m scripts.build_province_data --all
          elif [ -n "$CODES" ]; then
            python -m scripts.build_province_data $CODES
          else
            python -m scripts.build_province_data --index-only
          fi
        env:
          CODES: ${{ needs.scrape.outputs.codes }}

      - name: Write progress summary
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, csv, collections, datetime

          with open("data/locations_catalog.csv", newline="", encoding="utf-8") as f:
              catalog = list(csv.DictReader(f))
          total = collections.Counter(int(r["provincia_code"]) for r in catalog)
          names = {int(r["provincia_code"]): r["provincia_name"] for r in catalog}

          provincias, grand = {}, 0
          for p in sorted(total):
              pf = pathlib.Path(f"data/progress/progress_{p}.json")
              done = len(json.loads(pf.read_text())["completed"]) if pf.exists() else 0
              grand += done
              provincias[str(p)] = {
                  "nombre": names[p], "completados": done, "total": total[p],
              }

          csvs = sorted(pathlib.Path("data/raw/csvs").glob("*.csv"))
          summary = {
              "actualizado": datetime.datetime.now(datetime.timezone.utc)
                                     .strftime("%Y-%m-%dT%H:%M:%SZ"),
              "municipios_completados": grand,
              "municipios_totales": sum(total.values()),
              "csvs": len(csvs),
              "csvs_vacios": sum(1 for f in csvs if f.stat().st_size == 0),
              "provincias": provincias,
          }
          pathlib.Path("data/progress_summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(f"{grand}/{sum(total.values())} municipios, {summary['csvs']} CSVs "
                f"({summary['csvs_vacios']} vacíos)")
          PY

      # Committing docs/dashboard/data/ is what publishes: a push to main with
      # changes under docs/ triggers the Pages build.  The commit also resets
      # the 60-day clock GitHub uses to disable cron workflows on quiet repos,
      # which is what silently killed this schedule in April.
      - name: Commit and push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Any of these can be absent when an earlier step was skipped.
          for path in docs/dashboard/data data/progress_summary.json data/refresh_state.json; do
            if [ -e "$path" ]; then git add "$path"; fi
          done

          if git diff --staged --quiet; then
            echo "Nothing to publish"
            exit 0
          fi

          git commit -m "chore: datos $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            echo "Push attempt $i failed, retrying…"
            sleep 5
          done
          echo "::error::could not push after 3 attempts"
          exit 1

      # The raw CSVs only otherwise exist in the Actions cache, which GitHub
      # evicts after 7 days without a hit — the seed cache was already purged
      # that way.  Seven consecutive failed nights would therefore destroy
      # every measurement scraped since the February seed.  Release assets have
      # no expiry and do not count towards the repository size.
      - name: Back up raw data to release
        if: ${{ !inputs.skip_scrape }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -d data/raw/csvs ] || [ -z "$(ls -A data/raw/csvs 2>/dev/null)" ]; then
            echo "No raw data to back up"
            exit 0
          fi

          tar czf scraper-raw.tar.gz -C data raw/csvs progress
          echo "Tarball: $(du -h scraper-raw.tar.gz | cut -f1)"

          gh release view raw-data >/dev/null 2>&1 \
            || gh release create raw-data \
                 --title "Raw scraper data" \
                 --notes "Nightly snapshot of data/raw/csvs and data/progress. Overwritten by the update-data workflow."

          gh release upload raw-data scraper-raw.tar.gz --clobber
          gh release edit raw-data --notes "Última actualización: $(date -u +'%Y-%m-%d %H:%M UTC') — $(ls data/raw/csvs/*.csv | wc -l) CSVs"

      # ── Kaggle ──
      #
      # Still manual.  The Kaggle dataset publishes all_data_enriched.csv, which
      # is built from the 2.3 GB all_data.csv by an ETL that does not fit a
      # runner.  The dashboard no longer needs that file (see
      # scripts/build_province_data.py), but Kaggle does, so refreshing it means
      # running locally:
      #     python scripts/merge_csvs.py
      #     python -m scripts.run_etl
      #     kaggle datasets version -p data/kaggle/files/ -m "Update $(date +%F)"
